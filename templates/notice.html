{% extends "base.html" %}{% block title %}Post notice · CLASSORA{% endblock %}{% block content %}<div class="form-wrap"><a class="back" href="{{ url_for('index') }}">← Back to dashboard</a><div class="eyebrow">COMMUNICATION</div><h1>Publish a notice</h1><p class="muted">Share important academic updates with a semester and section.</p><section class="panel form-panel"><form method="post"><div class="field"><label>Notice title *</label><input name="title" required maxlength="160" placeholder="e.g. Internal assessment schedule"></div><div class="field"><label>Notice details *</label><textarea name="body" rows="5" required placeholder="Add dates, instructions or other details…"></textarea></div><div class="form-grid"><div class="field"><label>Semester *</label><select name="semester"><option>3</option><option>1</option><option>2</option><option>4</option><option>5</option><option>6</option><option>All</option></select></div><div class="field"><label>Section *</label><select name="section"><option>E</option><option>A</option><option>B</option><option>C</option><option>All</option></select></div></div><div class="form-actions"><a class="btn secondary" href="{{ url_for('index') }}">Cancel</a><button class="btn primary" type="submit">Publish notice ↗</button></div></form></section></div>{% endblock %}
